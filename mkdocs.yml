# Documentation site, published to GitHub Pages by .github/workflows/docs.yml.
#
#   python -m pip install -r docs/requirements.txt
#   python -m mkdocs serve      # preview at http://127.0.0.1:8000
#   python -m mkdocs build --strict
#
# Every page exists twice: name.md (English) and name.pl.md (Polish).
# Screenshots are generated by tools/docs_screenshots.py.

site_name: KeyEnroll
site_url: https://inowakowski.github.io/KeyEnroll/
site_description: >-
  Enroll FIDO2 security keys on behalf of users in Microsoft Entra ID, Okta,
  PingOne and PingOne Advanced Identity Cloud, on Windows, macOS and Linux.
site_author: Ignacy Nowakowski
copyright: "&copy; 2026 Ignacy Nowakowski. KeyEnroll is released under the MIT licence."

repo_url: https://github.com/inowakowski/KeyEnroll
repo_name: inowakowski/KeyEnroll
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  requirements.txt

# With --strict, a link to a missing page or heading fails the build.
validation:
  anchors: warn
  omitted_files: warn
  unrecognized_links: warn

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # System fonts: no requests to a font service when the page is read.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pl
          name: Polski
          build: true
          site_description: >-
            Rejestrowanie kluczy FIDO2 w imieniu użytkowników w Microsoft Entra ID,
            Okta, PingOne i PingOne Advanced Identity Cloud, na Windows, macOS
            i Linuksie.
          copyright: "&copy; 2026 Ignacy Nowakowski. KeyEnroll jest udostępniany na licencji MIT."
          nav_translations:
            Overview: Wprowadzenie
            Getting started: Pierwsze kroki
            Installation: Instalacja
            Quick start: Szybki start
            The window at a glance: Okno aplikacji w skrócie
            Using KeyEnroll: Praca z aplikacją
            Enrolling a key: Rejestracja klucza
            Bulk enrollment: Wdrożenie masowe
            Credentials: Poświadczenia
            Profiles: Profile
            Instances and sign-in: Instancje i logowanie
            Settings: Ustawienia
            Identity providers: Dostawcy tożsamości
            Reference: Informacje dodatkowe
            Data and security: Dane i bezpieczeństwo
            Troubleshooting: Rozwiązywanie problemów
            FAQ: Częste pytania
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Przełącz na tryb ciemny
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Przełącz na tryb jasny

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Getting started:
      - Installation: install.md
      - Quick start: quickstart.md
      - The window at a glance: interface.md
  - Using KeyEnroll:
      - Enrolling a key: enroll.md
      - Bulk enrollment: bulk.md
      - Credentials: credentials.md
      - Profiles: profiles.md
      - Instances and sign-in: instances.md
      - Settings: settings.md
  - Identity providers: providers.md
  - Reference:
      - Data and security: data.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
