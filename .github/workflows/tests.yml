name: tests

# Runs the linter and the test suite on every push to main and on pull
# requests. Installers are built by build.yml when a version tag is pushed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev swig libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - name: Install
        run: python -m pip install --only-binary=cryptography,PySide6-Essentials ".[nfc,dev]"
      - name: Lint
        run: python -m ruff check src tests packaging
      - name: Test
        run: python -m pytest -q
