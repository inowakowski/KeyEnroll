name: docs

# Checks that the documentation site still builds whenever it changes: a link
# to a missing page, heading or screenshot fails the run. The site itself is
# built and published by Cloudflare Pages straight from the repository.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r docs/requirements.txt
      - name: Build
        run: python -m mkdocs build --strict
